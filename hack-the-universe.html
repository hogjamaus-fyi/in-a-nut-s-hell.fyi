    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const videoIds = [
            'CzYthhieuDE',
            'DhBgFhaVSIg',
            'a6Bxo3ItBLQ',
            'EqAEjN0l-fQ',
            'U1lpTEk2BTI',
            'FNeUXM0uqm8',
            'RVY89rANb5U',
            'fLLO0_DrASk',
            'iO2eYyBOcTw',
            'kQzHuZhfZB0',
            'YGfHqQ-k0ys',
            'X1Ui4Td7vvA',
            '0Jro4Vg-StA',
            'izgu4Bl71Lw',
            'Qw5vkXcbI1c'
        ];
        const players = [];
        const isSeeking = [false, false, false];

        function onYouTubeIframeAPIReady() {
            videoIds.forEach((id, i) => {
                players[i] = new YT.Player('player' + (i + 1), {
                    videoId: id,
                    playerVars: {
                        controls: 0,
                        modestbranding: 1,
                        rel: 0,
                        fs: 0,
                        showinfo: 0,
                        iv_load_policy: 3,
                        disablekb: 0
                    },
                    events: {
                        onStateChange: (e) => onPlayerStateChange(e, i)
                    }
                });
            });
        }

        function onPlayerStateChange(event, i) {
            const btn = document.getElementById('btn' + (i + 1));
            if (event.data === YT.PlayerState.PLAYING) {
                btn.textContent = '⏸ Pause';
            } else {
                btn.textContent = '▶ Play';
            }
        }

        function togglePlay(i) {
            const p = players[i];
            if (!p) return;
            const state = p.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                p.pauseVideo();
            } else {
                p.playVideo();
            }
        }

        function seekVideo(i, value) {
            const p = players[i];
            if (!p) return;
            const duration = p.getDuration();
            if (!duration) return;
            const time = (value / 1000) * duration;
            p.seekTo(time, true);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return m + ':' + s;
        }

        setInterval(() => {
            players.forEach((p, i) => {
                if (!p || typeof p.getCurrentTime !== 'function') return;
                const current = p.getCurrentTime() || 0;
                const duration = p.getDuration() || 0;
                const slider = document.getElementById('slider' + (i + 1));
                const timeEl = document.getElementById('time' + (i + 1));
                if (slider && !isSeeking[i] && duration > 0) {
                    slider.value = (current / duration) * 1000;
                }
                if (timeEl && duration > 0) {
                    timeEl.textContent = formatTime(current) + ' / ' + formatTime(duration);
                }
            });
        }, 500);

        // Prevent slider drag from jumping during mousemove
        document.querySelectorAll('.seek-slider').forEach((slider, i) => {
            slider.addEventListener('mousedown', () => { isSeeking[i] = true; });
            slider.addEventListener('touchstart', () => { isSeeking[i] = true; });
            slider.addEventListener('mouseup', () => { isSeeking[i] = false; });
            slider.addEventListener('touchend', () => { isSeeking[i] = false; });
        });
    </script>
