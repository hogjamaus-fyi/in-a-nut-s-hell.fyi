        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 36px 36px;
            opacity: 0.36;

        }

        .wrap {

        h1 {

        .intro {
            margin: 0.55rem 0 1.15rem;
            line-height: 1.45;

        .family-note {
            margin: 0 0 1rem;
            font-weight: 700;
            color: #5b3d2d;
            font-style: italic;
        }

        .memory-ribbon {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0 0 14px;
        }

        .memory-chip {
            border-radius: 999px;
            padding: 5px 11px;
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #fff;
            background: var(--accent-rose);
        }

        .memory-chip:nth-child(2n) {
            background: var(--accent-leaf);
        }

        .memory-chip:nth-child(3n) {
            background: #6f54a1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            grid-template-rows: repeat(11, minmax(58px, auto));
            gap: 16px;
            align-items: stretch;
        }

        figure {
            margin: 0;
            background: var(--frame);
            border: 1px solid rgba(99, 66, 46, 0.2);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 24px rgba(78, 50, 36, 0.2);
            position: relative;
            transform: rotate(var(--tilt));
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        figure::before {
            content: "";
            position: absolute;
            width: 58px;
            height: 17px;
            top: 8px;
            left: calc(50% - 27px);
            border-radius: 3px;
            background: linear-gradient(130deg, rgba(255, 227, 180, 0.92), rgba(240, 188, 107, 0.95));
            border: 1px solid rgba(114, 74, 53, 0.35);
            z-index: 2;
            transform: rotate(-4deg);
            opacity: 0.95;
        }

        figure:hover {
            transform: rotate(0deg) translateY(-4px) scale(1.015);
            box-shadow: 0 16px 30px rgba(78, 50, 36, 0.26);
        }

        figure button {
            display: block;
            width: 100%;
            border: 0;
            margin: 0;
            padding: 0;
            background: transparent;
            cursor: pointer;
        }

        picture,
        img,
        video {
            display: block;
            width: 100%;
        }

        img {
            height: auto;
            background: #f3e8d8;
        }

        figcaption {
            padding: 10px 11px 12px;
            font-size: 0.9rem;

            background: linear-gradient(180deg, #fff8ed, #f6ecde);

            padding: 3px 8px;
            border-radius: 999px;
            background: #fff1dc;
            border: 1px solid rgba(164, 74, 66, 0.4);
            color: var(--chip);
            font-weight: 700;
        }

        .shot-1 {
            --tilt: -2.2deg;
            grid-column: 1 / span 5;
            grid-row: 1 / span 5;
        }

        .shot-2 {
            --tilt: 1.7deg;
            grid-column: 6 / span 3;
            grid-row: 1 / span 4;
        }

        .shot-3 {
            --tilt: -1.6deg;
            grid-column: 9 / span 4;
            grid-row: 1 / span 5;
        }

        .shot-4 {
            --tilt: 2deg;
            grid-column: 1 / span 6;
            grid-row: 6 / span 3;
        }

        .shot-5 {
            --tilt: -1.4deg;
            grid-column: 7 / span 6;
            grid-row: 6 / span 3;
        }

        .shot-6 {
            --tilt: 1.5deg;
            grid-column: 1 / span 6;
            grid-row: 9 / span 3;
        }

        .shot-7 {
            --tilt: -1.2deg;
            grid-column: 7 / span 6;
            grid-row: 9 / span 3;
        }

        .carousel {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 1rem;
            background: rgba(4, 8, 20, 0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            overflow-y: auto;
        }

        .carousel[aria-hidden="false"] {
            display: flex;
        }

        .carousel-shell {
            width: min(980px, 95vw);
            max-height: calc(100vh - 2rem);
            border-radius: 16px;
            background: #fff8ec;
            border: 1px solid rgba(119, 78, 55, 0.22);
            box-shadow: 0 24px 56px rgba(38, 18, 9, 0.44);
            overflow-y: auto;
            margin: auto 0;
        }

        .carousel-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: linear-gradient(180deg, #f9e4bf, #f3d6a2);
            border-bottom: 1px solid rgba(119, 78, 55, 0.2);
        }

        .carousel-title {
            margin: 0;
            font-size: 0.95rem;
            color: #5b331f;
            font-weight: 600;
        }

        .close-btn,
        .nav-btn {
            border: 1px solid rgba(127, 81, 52, 0.26);
            background: #fff1db;
            color: #57321f;
            border-radius: 999px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .close-btn {
            padding: 6px 10px;
        }

        .carousel-stage {
            display: grid;
            grid-template-columns: 46px minmax(0, 1fr) 46px;
            align-items: start;
            gap: 8px;
            padding: 12px;

        .nav-btn {

        }

        .carousel-figure {
            margin: 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(119, 78, 55, 0.24);
            background: #fff;
        }

        .carousel-image {
            display: block;
            width: 100%;
            max-height: 76vh;
            object-fit: contain;
            background: #f8efde;
        }

        .carousel-caption {
            padding: 10px 12px 12px;
            font-size: 0.95rem;
            color: #513224;
            background: linear-gradient(180deg, #fff5e6, #f8ecdc);
            white-space: pre-line;
        }

        .poem-block {
            margin: 0 11px 12px;
            font-size: 1.02rem;
            line-height: 1.55;
            color: #5a3b2c;
            background: rgba(255, 250, 242, 0.96);
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid rgba(119, 78, 55, 0.2);
            white-space: pre-line;
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 0 0 12px;
        }

        .carousel-dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            border: 0;
            background: #b79379;
            cursor: pointer;
            opacity: 0.8;
        }

        .carousel-dot.active {
            background: #a44a42;
            opacity: 1;
        }

        .back:focus-visible,
        .close-btn:focus-visible,
        .nav-btn:focus-visible,
        .open-carousel:focus-visible {
            outline: 2px solid #a44a42;
            outline-offset: 3px;
        }

        .open-carousel {
            min-height: 44px;
        }

        @media (max-width: 860px) {
            .wrap {

            }

            .memory-ribbon {

            }

            .memory-chip {
                font-size: 0.75rem;

            .back {
                width: 100%;

            }

            figure::before {
                width: 46px;

            }

            .carousel-stage {
                grid-template-columns: 36px minmax(0, 1fr) 36px;
                padding: 8px;
                gap: 6px;
            }

            .carousel-caption {
                font-size: 0.98rem;
            }

            .nav-btn {
                width: 36px;
                height: 36px;
            }

            .carousel-dot {
                width: 11px;
                height: 11px;
            }
        }
    </style>
</head>
