<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="He Is Legend - A curated YouTube playlist featuring inspiring and legendary content. Discover stories of legends and legendary moments.">
    <meta name="theme-color" content="#10250b">
    <meta property="og:title" content="He Is Legend - YouTube Playlist">
    <meta property="og:description" content="He Is Legend - A curated YouTube playlist featuring inspiring and legendary content.">
    <meta property="og:type" content="video.playlist">

    <title>He Is Legend - YouTube Playlist | shell</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow: hidden;
        }

        body {
            background: #10250b;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .header {
            color: rgba(250, 253, 255, 0.9);
            text-align: center;
            margin-bottom: 20px;
            font-family: "Fredoka", "Trebuchet MS", sans-serif;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
        }

        .header p {
            margin: 0;
            font-size: 0.95rem;
            color: rgba(246, 251, 255, 0.78);
        }

        .back-link {
            margin-bottom: 20px;
        }

        .back-link a {
            color: rgba(255, 255, 255, 0.84);
            text-decoration: none;
            font-family: "Fredoka", "Trebuchet MS", sans-serif;
            padding: 0.78rem 1rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.26);
            backdrop-filter: blur(8px);
            transition: transform 0.18s ease, background-color 0.18s ease;
            display: inline-block;
        }

        .back-link a:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.2);
        }

        .iframe-wrapper {
            width: 100%;
            max-width: 900px;
            height: 70vh;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(6, 14, 10, 0.42);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Hide YouTube share buttons, watch buttons, and UI elements */
        .iframe-wrapper iframe::after,
        .iframe-wrapper [style*="share"],
        .iframe-wrapper [class*="share"],
        .iframe-wrapper [id*="share"],
        .iframe-wrapper button[aria-label*="Share"],
        .iframe-wrapper button[aria-label*="Watch"],
        .iframe-wrapper [class*="button"][aria-label*="Share"],
        .iframe-wrapper [class*="button"][aria-label*="Watch"] {
            display: none !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="back-link">

        </div>
    </div>
</body>

</html>
