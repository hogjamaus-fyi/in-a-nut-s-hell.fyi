<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Neon-soaked carousel of surreal imagery. Click to expand. Pure cyberpunk vibes and dystopian energy.">
  <meta property="og:title" content="Cyberpunk 2049: Wayway Edition | in-a-nut-s-hell.fyi">
  <meta property="og:description" content="Neon-soaked carousel of surreal imagery. Click to expand. Pure cyberpunk vibes and dystopian energy.">
  <title>Cyberpunk 2049: Wayway Edition</title>
  <style>
    body {
      background: linear-gradient(135deg, #1a0000 0%, #ff3300 100%);
      color: #ff6600;
      font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px 10px #ff3300 inset;
    }
    h1 {
      font-size: 3rem;
      color: #ff3300;
      text-shadow: 0 0 10px #ff6600, 0 0 40px #ff3300;
      margin-bottom: 1.5rem;
      letter-spacing: 0.1em;
    }
    .gallery {
      display: flex;
      flex-direction: row;
      gap: 2rem;
      margin-bottom: 2rem;
    }
    .gallery img {
      border: 4px solid #ff3300;
      border-radius: 16px;
      box-shadow: 0 0 30px 5px #ff6600, 0 0 10px 2px #ff3300;
      max-width: 300px;
      max-height: 300px;
      background: #1a0000;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .gallery img:hover {
      transform: scale(1.08) rotate(-2deg);
      box-shadow: 0 0 60px 10px #ff3300, 0 0 20px 4px #ff6600;
      border-color: #ff6600;
    }
    .caption {
      color: #ff6600;
      text-align: center;
      margin-top: 0.5rem;
      font-size: 1.1rem;
      text-shadow: 0 0 8px #ff3300;
    }
    .carousel-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 0, 0, 0.9);
      backdrop-filter: blur(5px);
      z-index: 9999;
      padding: 2vh 2vw;
      box-sizing: border-box;
    }
    .carousel-overlay.open {
      display: flex;
    }
    .carousel-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 94vw;
      height: 90vh;
      gap: 1rem;
    }
    #carousel-img {
      max-width: 92vw;
      max-height: 75vh;
      width: auto;
      height: auto;
      border: 4px solid #ff3300;
      border-radius: 18px;
      box-shadow: 0 0 70px 10px #ff3300;
      object-fit: contain;
      background: #110000;
    }
    #carousel-caption,
    #desc {
      text-align: center;
      color: #ff6600;
      text-shadow: 0 0 8px #ff3300;
      max-width: 90vw;
    }
    #carousel-caption {
      font-size: 1.35rem;
      font-weight: 700;
    }
    #desc {
      font-size: 1rem;
      opacity: 0.95;
    }
    .carousel-nav,
    #return-btn {
      position: absolute;
      background: rgba(255, 51, 0, 0.18);
      color: #ff7a33;
      border: 2px solid #ff3300;
      border-radius: 10px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
    }
    #return-btn {
      top: 2rem;
      right: 2rem;
      font-size: 1rem;
      padding: 0.6rem 1rem;
    }
    .carousel-nav {
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.5rem;
      line-height: 1;
      width: 3rem;
      height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #carousel-prev {
      left: 1rem;
    }
    #carousel-next {
      right: 1rem;
    }
    footer {
      margin-top: 2rem;
      color: #ff3300;
      font-size: 1rem;
      text-shadow: 0 0 8px #ff6600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }
    .footer-text {
      font-size: 0.95rem;
    }
    .return-btn {
      background: linear-gradient(135deg, rgba(255, 51, 0, 0.18) 0%, rgba(255, 102, 0, 0.12) 100%);
      color: #ff6600;
      border: 2px solid #ff3300;
      border-radius: 10px;
      padding: 0.7rem 1.3rem;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Orbitron', monospace;
      letter-spacing: 0.07em;
      cursor: pointer;
      text-transform: uppercase;
      text-shadow: 0 0 8px #ff3300;
      box-shadow: 0 0 25px rgba(255, 102, 0, 0.3), inset 0 0 12px rgba(255, 51, 0, 0.08);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-block;
    }
    .return-btn:hover {
      background: linear-gradient(135deg, rgba(255, 51, 0, 0.3) 0%, rgba(255, 102, 0, 0.22) 100%);
      border-color: #ff6600;
      color: #ff3300;
      box-shadow: 0 0 40px rgba(255, 102, 0, 0.5), inset 0 0 15px rgba(255, 51, 0, 0.12);
      text-shadow: 0 0 12px #ff6600, 0 0 6px #ff3300;
      transform: translateY(-2px);
    }
    .return-btn:active {
      transform: translateY(0);
    }
    /* Cyberpunk 2049 Languages Menu Styling */
    #languageer-safe {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      bottom: auto !important;
      z-index: 5000;
      font-family: 'Orbitron', monospace;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
    }
    #languageer-options {
      background: linear-gradient(135deg, rgba(255, 51, 0, 0.2) 0%, rgba(255, 102, 0, 0.15) 100%);
      color: #ff3300;
      border: 2px solid #ff3300;
      border-radius: 8px;
      padding: 0.65rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Orbitron', monospace;
      letter-spacing: 0.08em;
      cursor: pointer;
      text-transform: uppercase;
      text-shadow: 0 0 10px #ff6600, 0 0 5px #ff3300;
      box-shadow: 0 0 25px rgba(255, 102, 0, 0.4), inset 0 0 15px rgba(255, 51, 0, 0.1);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }
    #languageer-options:hover {
      background: linear-gradient(135deg, rgba(255, 51, 0, 0.35) 0%, rgba(255, 102, 0, 0.25) 100%);
      border-color: #ff6600;
      box-shadow: 0 0 40px rgba(255, 102, 0, 0.6), inset 0 0 20px rgba(255, 51, 0, 0.15);
      transform: scale(1.05);
    }
    #languageer-options:active {
      transform: scale(0.98);
    }
    #languageer-menu {
      position: absolute;
      top: calc(100% + 0.8rem);
      right: 0;
      background: linear-gradient(135deg, rgba(10, 0, 0, 0.95) 0%, rgba(26, 0, 0, 0.98) 100%);
      border: 2px solid #ff3300;
      border-radius: 12px;
      padding: 0.8rem 0.6rem;
      min-width: 140px;
      box-shadow: 0 0 50px rgba(255, 51, 0, 0.5), inset 0 0 30px rgba(255, 102, 0, 0.1);
      display: none !important;
      flex-direction: column !important;
      grid-template-columns: unset !important;
      gap: 0.5rem !important;
      opacity: 0;
      transform: translateY(-10px) scale(0.95);
      transition: all 0.25s ease-out;
      pointer-events: none;
      backdrop-filter: blur(8px);
      margin-top: 0 !important;
      padding-top: 0 !important;
      border-top: none !important;
    }
    #languageer-safe.open #languageer-menu {
      display: flex !important;
      opacity: 1 !important;
      transform: translateY(0) scale(1) !important;
      pointer-events: auto !important;
    }
    #languageer-menu button {
      background: linear-gradient(135deg, rgba(255, 51, 0, 0.12) 0%, rgba(255, 102, 0, 0.08) 100%) !important;
      color: #ff6600 !important;
      border: 1.5px solid rgba(255, 102, 0, 0.6) !important;
      border-radius: 6px !important;
      padding: 0.6rem 0.9rem !important;
      font-size: 0.9rem !important;
      font-weight: 600 !important;
      font-family: 'Orbitron', monospace !important;
      letter-spacing: 0.06em !important;
      cursor: pointer !important;
      text-transform: uppercase !important;
      text-shadow: 0 0 6px rgba(255, 102, 0, 0.5) !important;
      box-shadow: 0 0 12px rgba(255, 102, 0, 0.2), inset 0 0 8px rgba(255, 51, 0, 0.05) !important;
      transition: all 0.25s ease !important;
      position: relative !important;
    }
    #languageer-menu button:hover {
      background: linear-gradient(135deg, rgba(255, 51, 0, 0.25) 0%, rgba(255, 102, 0, 0.18) 100%) !important;
      border-color: #ff3300 !important;
      color: #ff3300 !important;
      box-shadow: 0 0 25px rgba(255, 102, 0, 0.5), inset 0 0 12px rgba(255, 51, 0, 0.1) !important;
      text-shadow: 0 0 10px #ff6600, 0 0 5px #ff3300 !important;
      transform: translateX(3px) !important;
    }
    #languageer-menu button[data-lang] {
      writing-mode: horizontal-tb;
    }
    #languageer-menu button.active {
      background: linear-gradient(135deg, rgba(255, 51, 0, 0.35) 0%, rgba(255, 102, 0, 0.25) 100%) !important;
      border-color: #ff3300 !important;
      color: #ff3300 !important;
      font-weight: 700 !important;
      box-shadow: 0 0 30px rgba(255, 51, 0, 0.5), 0 0 15px rgba(255, 102, 0, 0.3), inset 0 0 10px rgba(255, 51, 0, 0.12) !important;
      text-shadow: 0 0 12px #ff6600, 0 0 6px #ff3300 !important;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <h1>Cyberpunk 2049: Wayway Edition</h1>
  <div class="gallery">
    <div>
      <img src="my-name-is-mud.webp" alt="My Name is Mud">
      <div class="caption">My Name is Mud</div>
    </div>
    <div>
      <img src="i-agree-piss-ham-wak-skippies.webp" alt="I Agree Piss Ham Wak Skippies">
      <div class="caption">I Agree Piss Ham Wak Skippies</div>
    </div>
    <div>
      <img src="deadman-walkin.gif" alt="Deadman Walkin">
      <div class="caption">Deadman Walkin</div>
    </div>
  </div>
  <div id="wayway-carousel" class="carousel-overlay" aria-hidden="true">
    <button id="return-btn" type="button" aria-label="Close carousel">Return</button>
    <button id="carousel-prev" class="carousel-nav" type="button" aria-label="Previous image">&lsaquo;</button>
    <div class="carousel-content">
      <img id="carousel-img" src="" alt="Expanded carousel media">
      <div id="carousel-caption"></div>
      <div id="desc"></div>
    </div>
    <button id="carousel-next" class="carousel-nav" type="button" aria-label="Next image">&rsaquo;</button>
  </div>
  <footer>
    <a href="index.html" id="return-to-index" class="return-btn">← Return</a>
    <div class="footer-text">©️ 2049 Cyberpunk Wayway Edition. All rights reserved.</div>
  </footer>
  <script src="cyberpunk-2049-aye-wayway-edition.js"></script>
  <script src="languages-open-menu.js"></script>
</body>
</html>
